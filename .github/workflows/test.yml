name: Test

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Go tests
        run: go test ./... -v

      - name: Run integration tests
        run: go test ./tests/integration -v

      - name: Build CLI
        run: go build -o tracelet ./cmd/tracelet

      - name: Verify binary
        run: ./tracelet lint --help

