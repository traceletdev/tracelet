name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Build releases with the latest patched Go so shipped binaries pick up
          # standard-library security fixes.
          go-version: 'stable'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack binaries for npm
        run: npm run pack:bin

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update package versions
        run: |
          node -e "
            const fs = require('fs');
            const version = '${{ steps.version.outputs.version }}';
            const platformDirs = [
              'cli-darwin-arm64', 'cli-darwin-x64',
              'cli-linux-arm64', 'cli-linux-x64',
              'cli-win32-arm64', 'cli-win32-x64',
            ];
            const packages = [
              { path: './package.json' },
              { path: './packages/tracelet-next/package.json' },
              { path: './packages/tracelet-vite/package.json' },
              { path: './packages/tracelet-react/package.json' },
              ...platformDirs.map(dir => ({ path: \`./packages/\${dir}/package.json\` })),
            ];
            packages.forEach(({ path }) => {
              if (fs.existsSync(path)) {
                const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
                pkg.version = version;
                if (pkg.optionalDependencies) {
                  for (const dep of Object.keys(pkg.optionalDependencies)) {
                    if (dep.startsWith('@traceletdev/cli-')) pkg.optionalDependencies[dep] = version;
                  }
                }
                fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
              }
            });
          "

      # Authenticates via npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
      # Requires a Trusted Publisher configured on each package at npmjs.com
      # (repo: traceletdev/tracelet, workflow: release.yml) — see RELEASE.md.
      # Platform binary packages publish first so @traceletdev/cli's
      # optionalDependencies resolve once it publishes last. Skips any package
      # already published at this version (e.g. after a manual bootstrap).
      - name: Publish to npm
        run: |
          publish_if_new() {
            local name="$1" dir="$2" version="${{ steps.version.outputs.version }}"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip: $name@$version already published"
            else
              (cd "$dir" && npm publish --access public)
            fi
          }
          for dir in cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64 cli-win32-arm64 cli-win32-x64; do
            publish_if_new "@traceletdev/$dir" "packages/$dir"
          done
          publish_if_new "@traceletdev/next" packages/tracelet-next
          publish_if_new "@traceletdev/vite" packages/tracelet-vite
          publish_if_new "@traceletdev/react" packages/tracelet-react
          publish_if_new "@traceletdev/cli" .
        working-directory: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

