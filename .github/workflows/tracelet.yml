name: Tracelet CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  tracelet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build tracelet CLI
        run: |
          go build -o tracelet ./cmd/tracelet

      # Optional: run your framework build to produce stats
      # - name: Build app (optional)
      #   run: |
      #     npm ci
      #     npm run build
      #   working-directory: ./

      - name: Ensure .tracelet dir
        run: mkdir -p .tracelet

      - name: Check for config file
        id: check_config
        run: |
          if [ -f "tracelet.config.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Compare against baseline and generate markdown
        id: compare
        if: steps.check_config.outputs.exists == 'true'
        run: |
          set -e
          ./tracelet ci --compare .tracelet/baseline.json --format markdown > report.md || true
          echo "generated=1" >> $GITHUB_OUTPUT

      - name: Upload report artifact
        if: steps.check_config.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tracelet-report
          path: report.md
          if-no-files-found: ignore

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.check_config.outputs.exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('report.md')) {
              const body = fs.readFileSync('report.md', 'utf8');
              if (body.trim()) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body
                });
              }
            }

      - name: Update baseline on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_config.outputs.exists == 'true'
        run: |
          ./tracelet ci --write-baseline .tracelet/baseline.json
          echo "Baseline updated. Commit this file to persist changes."


