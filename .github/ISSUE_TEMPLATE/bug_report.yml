name: Bug report
description: Report a problem with tracelet
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands run, config used, and the output you saw.
      placeholder: |
        1. tracelet lint ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tracelet version
      description: Output of `tracelet --version` (or the npm/commit version).
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - CLI (lint / probe / ci / fix)
        - HUD overlay
        - VS Code extension
        - Framework plugin (next / vite / react)
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Go version (if building from source), Node version, framework + version.
    validations:
      required: false
